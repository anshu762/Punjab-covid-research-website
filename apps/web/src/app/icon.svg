<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="epilens-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <filter id="epilens-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="7.5" fill="url(#epilens-grad)"/>
  <!-- Subtle border highlight -->
  <rect width="30.5" height="30.5" x="0.75" y="0.75" rx="7" fill="none" stroke="#93C5FD" stroke-width="0.75" stroke-opacity="0.35"/>
  <!-- EpiLens Epidemic Pulse Line -->
  <path d="M4 16h4.5l3.5 8.5 5.5 -17 4 8.5h6.5" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" filter="url(#epilens-glow)"/>
  <!-- Cyan indicator dot -->
  <circle cx="21.5" cy="16" r="1.5" fill="#38BDF8"/>
</svg>
